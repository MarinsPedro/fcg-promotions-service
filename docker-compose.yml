services:
  promotions-db:
    image: postgres:17-alpine
    container_name: fcg-promotions-db
    environment:
      POSTGRES_DB: fcg_promotions
      POSTGRES_USER: fcg_promotions_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevPass123!}
    ports:
      - "5434:5432"
    volumes:
      - promotions-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_promotions_app -d fcg_promotions"]
      interval: 5s
      timeout: 3s
      retries: 5

  promotions-migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
      secrets:
        - nuget_config
    container_name: fcg-promotions-migrations
    environment:
      ConnectionStrings__Database: "Host=promotions-db;Port=5432;Database=fcg_promotions;Username=fcg_promotions_app;Password=${POSTGRES_PASSWORD:-DevPass123!}"
    depends_on:
      promotions-db:
        condition: service_healthy

  promotions-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      secrets:
        - nuget_config
    container_name: fcg-promotions-api
    environment:
      ConnectionStrings__Database: "Host=promotions-db;Port=5432;Database=fcg_promotions;Username=fcg_promotions_app;Password=${POSTGRES_PASSWORD:-DevPass123!}"
      Authentication__Authority: "http://host.docker.internal:5081"
      Authentication__Audience: "promotions-api"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5084:8080"
    depends_on:
      promotions-db:
        condition: service_healthy
      promotions-migrations:
        condition: service_completed_successfully

volumes:
  promotions-data:

secrets:
  nuget_config:
    file: ./NuGet.Config
