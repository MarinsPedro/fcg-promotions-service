name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          source-url: https://nuget.pkg.github.com/MarinsPedro/index.json
      - run: dotnet restore FiapCloudGames.Promotions.slnx
      - run: dotnet format FiapCloudGames.Promotions.slnx --verify-no-changes --no-restore
      - run: dotnet build FiapCloudGames.Promotions.slnx -c Release --no-restore
      - run: dotnet test FiapCloudGames.Promotions.slnx -c Release --no-build --no-restore
